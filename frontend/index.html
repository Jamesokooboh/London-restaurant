<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Thames Tavern | London</title>
    <style>
        body { font-family: 'Georgia', serif; background-color: #f4f1ea; color: #2c3e50; margin: 0; padding: 0; }
        header { background-color: #1a252f; color: #e74c3c; text-align: center; padding: 3rem 1rem; }
        h1 { margin: 0; font-size: 3rem; letter-spacing: 2px; }
        p.subtitle { color: #ecf0f1; font-style: italic; font-size: 1.2rem; }
        .container { max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
        .menu-item { background: white; margin-bottom: 1.5rem; padding: 1.5rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border-left: 5px solid #e74c3c; }
        .menu-item h3 { margin-top: 0; display: flex; justify-content: space-between; }
        .price { font-weight: bold; color: #27ae60; }
    </style>
</head>
<body>
    <header>
        <h1>The Thames Tavern</h1>
        <p class="subtitle">Authentic British Dining in the Heart of London</p>
    </header>
    <div class="container">
        <h2>Our Classic Menu</h2>
        <div id="menu-container">Loading menu from the kitchen...</div>
    </div>

    <script>
        // Fetches data via the Nginx reverse proxy routing to the backend container
        fetch('/api/menu')
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('menu-container');
                container.innerHTML = '';
                data.forEach(item => {
                    container.innerHTML += `
                        <div class="menu-item">
                            <h3>${item.name} <span class="price">£${item.price}</span></h3>
                            <p>${item.description}</p>
                        </div>
                    `;
                });
            })
            .catch(error => {
                document.getElementById('menu-container').innerHTML = '<p>Error loading menu. Please check back later.</p>';
                console.error('Error:', error);
            });
    </script>
</body>
</html>
