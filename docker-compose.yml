services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: restaurant
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - london_net

  backend:
    build: ./backend
    environment:
      DB_HOST: db
      DB_USER: admin
      DB_PASSWORD: password
      DB_NAME: restaurant
      PORT: 5000
      JWT_SECRET: change-me-in-production
    ports:
      - "5000:5000"
    depends_on:
      - db
    networks:
      - london_net

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - london_net

volumes:
  db_data:

networks:
  london_net:
    driver: bridge